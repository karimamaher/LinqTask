<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>HTML Form Example</h1>
    <p>This is an example of an <del>HTML4</del> <u>HTML5</u> from containing يحتوى various <span
            style="background-color: yellow;">input</span> controls:</p>
    <form>
        <fieldset>
            <legend>User Information</legend>
            <label for="username">Username: </label>
            <input type="text" id="username" name="username"><br><br>
            <label for="email">Email: </label>
            <input type="email" id="email" name="email"><br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password"><br><br>
        </fieldset>

        <fieldset>
            <legend>Contact Information</legend>
            <label for="phone">Phone: </label>
            <input type="tel" id="phone" name="phone"><br><br>

            <label for="message">Message: </label><br>
            <textarea id="message" name="message" cols="50" rows="5"></textarea>

        </fieldset>

        <fieldset>
            <legend>Subscription</legend>
            <label for="sub1">Subscribe to newsletter: </label>
            <input type="checkbox" id="sub1" name="sub1"><br>
            <label for="sub2">Subscribe to newsletter: </label>
            <input type="checkbox" id="sub2" name="sub2"><br>

        </fieldset>

        <fieldset>
            <legend>Preferred Language</legend>
            <label for="language">Select your preferred language: </label>
            <select id="language" name="language">
                <option value="english" selected>English</option>
                <option value="spanish">Spanish</option>
                <option value="french">French</option>
                <option value="german">German</option>
            </select>

        </fieldset>

        <fieldset>
            <legend>Feedback</legend>
            <label for="rate">Rate our service: </label>
            <input type="range" id="rate" name="rate">

        </fieldset>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>



</body>

</html>
